<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .joke-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .joke-text {
            color: #333;
            font-size: 1.3em;
            line-height: 1.6;
            font-weight: 500;
        }

        .joke-setup {
            color: #555;
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        .joke-punchline {
            color: #667eea;
            font-size: 1.2em;
            margin-top: 15px;
            font-weight: bold;
        }

        .loading {
            color: #667eea;
            font-size: 1.2em;
            font-weight: bold;
        }

        .error {
            color: #e74c3c;
            font-size: 1.1em;
            font-weight: bold;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .joke-type {
            color: #999;
            font-size: 0.9em;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .joke-text {
                font-size: 1.1em;
            }

            button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh</p>
        
        <div class="joke-box" id="jokeBox">
            <p class="loading">Click the button to get a joke!</p>
        </div>

        <button id="newJokeBtn" onclick="fetchJoke()">Get New Joke</button>
    </div>

    <script>
        // Fetch joke from JokeAPI
        async function fetchJoke() {
            const jokeBox = document.getElementById('jokeBox');
            const button = document.getElementById('newJokeBtn');

            // Disable button and show loading state
            button.disabled = true;
            jokeBox.innerHTML = '<p class="loading">Loading a joke for you...</p>';

            try {
                // Fetch from JokeAPI
                const response = await fetch('https://v2.jokeapi.dev/joke/Any?safe-mode');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Check if the API returned an error
                if (data.error) {
                    throw new Error('Failed to fetch joke');
                }

                // Display the joke
                if (data.type === 'single') {
                    // Single joke
                    jokeBox.innerHTML = `
                        <p class="joke-text">${escapeHtml(data.joke)}</p>
                        <p class="joke-type">Type: ${data.category}</p>
                    `;
                } else if (data.type === 'twopart') {
                    // Two-part joke (setup and delivery)
                    jokeBox.innerHTML = `
                        <p class="joke-setup">${escapeHtml(data.setup)}</p>
                        <p class="joke-punchline">${escapeHtml(data.delivery)}</p>
                        <p class="joke-type">Type: ${data.category}</p>
                    `;
                }
            } catch (error) {
                console.error('Error fetching joke:', error);
                jokeBox.innerHTML = `
                    <p class="error">Oops! Failed to fetch a joke. Please try again.</p>
                    <p class="error" style="font-size: 0.9em; margin-top: 10px;">${error.message}</p>
                `;
            } finally {
                // Re-enable button
                button.disabled = false;
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Load a joke when the page loads
        window.addEventListener('load', fetchJoke);
    </script>
</body>
</html>
